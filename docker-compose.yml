services:
  loan-report-qas:
    build: .
    image: loan-report-qas:1.0.1
    container_name: loan-report-qas
    ports:
      - "3000:3000"
    volumes:
      # SQLite 数据库文件持久化目录（备份 = 拷贝该目录）
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      # 开发环境：灌入演示数据（生产镜像默认 LR_SEED_DEMO=0）
      - LR_SEED_DEMO=1
    restart: unless-stopped
